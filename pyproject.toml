[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pandemic-prep-dash"
version = "0.1.0"
description = "Adaptive Whole-of-Government CBRN & Pandemic Preparedness Response Dashboard with Agentic Workflow Pathways"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mike Kuiper", email = "mike@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "networkx>=3.2.0",
    "jinja2>=3.1.3",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
pandemic-prep = "pandemic_prep_dash.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
